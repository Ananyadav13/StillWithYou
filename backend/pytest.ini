[pytest]
testpaths = tests
addopts = -v --tb=short

# One event loop for the whole session. The SQLAlchemy engine, the asyncpg pool
# and the Redis client are process-wide singletons bound to the loop that created
# them; a loop per test closes those connections underneath the next test and
# fails with "Event loop is closed".
asyncio_mode = auto
asyncio_default_fixture_loop_scope = session
asyncio_default_test_loop_scope = session
